{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create account</title>
    <link rel="stylesheet" href="{% static 'authentication/auth.css' %}" />
  </head>
  <body class="auth-page">
    <div class="auth-card">
      <p class="auth-eyebrow">Start reading</p>
      <h1 class="auth-title">Create account</h1>
      <p class="auth-subtitle">
        Join the blog for new essays, notes, and personal updates.
      </p>

      <div id="signup-message" class="auth-errors" hidden></div>

      <form
        id="signup-form"
        method="post"
        action="{% url 'signup' %}"
        novalidate
      >
        {% csrf_token %}

        <div class="auth-field">
          <label for="id_first_name">First name</label>
          <input
            type="text"
            name="first_name"
            id="id_first_name"
            placeholder="Mayar"
            required
            autofocus
          />
        </div>

        <div class="auth-field">
          <label for="id_last_name">Last name</label>
          <input
            type="text"
            name="last_name"
            id="id_last_name"
            placeholder="Abd Elbasser"
            required
          />
        </div>

        <div class="auth-field">
          <label for="id_email">Email</label>
          <input
            type="email"
            name="email"
            id="id_email"
            placeholder="mayar@example.com"
            required
          />
        </div>

        <div class="auth-field">
          <label for="id_password">Password</label>
          <input
            type="password"
            name="password"
            id="id_password"
            placeholder="Choose a password"
            required
            autocomplete="new-password"
          />
        </div>

        <button type="submit" class="auth-submit">Create account</button>
      </form>

      <p class="auth-switch">
        Already have an account? <a href="{% url 'signin' %}">Sign in</a>
      </p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="{% static 'authentication/auth.js' %}"></script>
    <script src="{% static 'authentication/signup.js' %}"></script>
  </body>
</html>
